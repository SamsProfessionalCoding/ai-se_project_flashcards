<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Samuel Moore" />
    <meta
      name="description"
      content="A flashcard themed study application designed to teach programming basics."
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, learning application"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Tripleten Flashcard Application</title>
  </head>
  <body class="page">
    <header id="header" class="header">
      <h1 class="header__title">
        <a href="index.html" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li class="nav__link">
            <a href="#home" class="hyperlink">Home</a>
          </li>
          <li class="nav__link">
            <a href="#home" class="hyperlink">My Decks</a>
          </li>
          <li class="nav__link">
            <a href="#about" class="hyperlink">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main id="page__main-content" class="page__main-content">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="decks__list">
            <template id="deck__template">
              <li class="deck">
                <a href="#" class="deck__link"></a>
                <h3 class="deck__title"></h3>
                <div class="deck__row">
                  <h4 class="deck__count"></h4>
                  <button
                    class="deck__delete-btn"
                    aria-label="Delete this deck"
                    type="button"
                  >
                    <img
                      src="./assets/images/delete.svg"
                      alt="a trash/delete button for a deck"
                    />
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <button
            class="decks__new-deck-btn"
            aria-label="Create new deck of flashcards."
            type="button"
          >
            + New Deck
          </button>
        </div>
      </section>
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="View previous flashcard"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card_text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="View next flashcard"
          ></button>
        </div>
        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip the flashcard"
        ></button>
      </section>
      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>
    <footer id="footer" class="footer">
      <p class="footer__text">&copy;2026 Samuel Moore</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
